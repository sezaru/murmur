[package]
name = "murmur"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
earshot = "1.2.2"
hound = "3.5.1"
libc = "0.2.190"
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "load-dynamic", "api-24"] }
parakeet-rs = { version = "=0.4.1", default-features = false, features = ["cpu", "load-dynamic", "api-24"] }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }


[profile.release]
lto = "thin"
strip = true
